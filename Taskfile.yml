version: '3'

vars:
  QT_DIR: /Users/rajsekharan/Qt/6.5.3/macos
  BUILD_DIR: build

tasks:
  default:
    cmds:
      - task -l

  icons:
    desc: Validate single-source app_icon.png via ffprobe and generate cross-platform .ico and .icns icons via ffmpeg
    cmds:
      - bash scripts/generate_icons.sh

  configure:
    desc: Configure Release CMake build for Markd with Qt 6.5.3
    run: once
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -DCMAKE_PREFIX_PATH={{.QT_DIR}}/lib/cmake -DCMAKE_BUILD_TYPE=Release

  build:
    desc: Compile optimized Markd executable and assertion-enabled test suite
    run: once
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j8

  test-cpp:
    desc: Run C++ test suite (pure C++, headless, -UNDEBUG enforced)
    deps: [build]
    cmds:
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure

  test-web:
    desc: Run JavaScript test suite with Node.js
    dir: web
    cmds:
      - "[ -d node_modules ] || npm ci --prefer-offline --no-audit --no-fund"
      - npm test

  coverage-web:
    desc: Run JavaScript test suite with c8 and verify 100% branch and line coverage
    dir: web
    cmds:
      - "[ -d node_modules ] || npm ci --prefer-offline --no-audit --no-fund"
      - npm run test:coverage

  coverage-cpp:
    desc: Run C++ test suite and enforce >= 95% line coverage via LLVM source instrumentation
    cmds:
      - cmake -B build_cov -S . -DCMAKE_PREFIX_PATH={{.QT_DIR}}/lib/cmake -DENABLE_COVERAGE=ON
      - cmake --build build_cov -j8
      - LLVM_PROFILE_FILE=build_cov/test_cli.profraw ./build_cov/test_cli
      - xcrun llvm-profdata merge -sparse build_cov/test_cli.profraw -o build_cov/test_cli.profdata
      - node ../../../kernel/quality-gate/check_cpp_coverage.js ./build_cov/test_cli build_cov/test_cli.profdata 95.0

  coverage:
    desc: Run both C++ and Web coverage verification suites (100% web, >=95% C++)
    cmds:
      - task: coverage-web
      - task: coverage-cpp

  calisthenics:
    desc: Enforce 100/100 strict Object Calisthenics on new modules and non-degrading ratchet across src and web/src
    cmds:
      - |
        node -e '
          const { runAudit } = require("../../../kernel/quality-gate/calisthenics_auditor.js");
          const strictTargets = [
            "src/app/CommandLineOptions.h",
            "src/app/CommandLineOptions.cpp",
            "src/app/SingleInstanceCoordinator.h",
            "src/app/SingleInstanceCoordinator.cpp",
            "src/app/MarkdApplication.h",
            "src/app/MarkdApplication.cpp",
            "src/ui/InstantPreviewSurface.h",
            "src/ui/InstantPreviewSurface.cpp",
            "src/ui/WebEngineBackend.h",
            "src/ui/WebEngineBackend.cpp"
          ];
          for (const target of strictTargets) {
            runAudit(target, { strict: true, minScore: 100 });
          }
          const cpp = runAudit("src");
          if (cpp.totalElse > 10 || cpp.totalDeepNesting > 198 || cpp.totalLargeFiles > 5) {
            console.error("C++ Calisthenics ratchet regression:", cpp);
            process.exit(1);
          }
          const web = runAudit("web/src");
          if (web.totalElse > 6 || web.totalDeepNesting > 179 || web.totalLargeFiles > 1) {
            console.error("Web Calisthenics ratchet regression:", web);
            process.exit(1);
          }
        '

  benchmark:
    desc: Verify p95 startup latency budgets (--version <25ms, IPC <60ms, instant paint <120ms, prose hydration <450ms)
    deps: [build]
    cmds:
      - bash scripts/benchmark_startup.sh

  gate:
    desc: Run full 4-tier quality gate (tests + coverage + strict Object Calisthenics + startup latency budgets)
    cmds:
      - task: test
      - task: coverage
      - task: calisthenics
      - task: benchmark

  test:
    desc: Run both decoupled test suites (C++ and Web)
    cmds:
      - task: test-cpp
      - task: test-web

  test-all:
    desc: Alias for test
    cmds:
      - task: test

  package-macos:
    desc: Bundle Markd.app via macdeployqt, prune bloat, verify Mach-O & codesign, and generate .dmg, .tar.gz, and SHA256SUMS.txt
    run: once
    deps: [build]
    cmds:
      - bash scripts/package_macos.sh

  homebrew-formula:
    desc: Generate Homebrew formula (markd.rb) from packaged macOS archive
    deps: [package-macos]
    cmds:
      - bash scripts/generate_homebrew_formula.sh --output ../../../lab/markd-website/homebrew/markd.rb

  update-manifest:
    desc: Update lab/markd-website/api/v1/updates/check with packaged darwin-arm64 .tar.gz SHA-256
    deps: [package-macos]
    cmds:
      - |
        VERSION="$(grep -E 'MARKD_VERSION_STR' src/core/Version.h | sed -E 's/.*"([^"]+)".*/\1/')"
        TAR_SHA="$(shasum -a 256 "{{.BUILD_DIR}}/dist/Markd-${VERSION}-darwin-arm64.tar.gz" | awk '{print $1}')"
        bash scripts/update_manifest.sh \
          --darwin-arm64-sha256 "$TAR_SHA" \
          --darwin-arm64-url "https://markd.aramudan.dev/releases/v${VERSION}/Markd-${VERSION}-darwin-arm64.tar.gz"

  release:
    desc: Run tests, package macOS release, generate Homebrew formula, and update edge manifest
    cmds:
      - task: test
      - task: package-macos
      - task: homebrew-formula
      - task: update-manifest

  run:
    desc: Run Markd executable with optional markdown file (e.g. task run -- file.md)
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/markd {{.CLI_ARGS}}

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  install-app:
    desc: Package and install Markd.app to /Applications and register with macOS LaunchServices
    deps: [package-macos]
    cmds:
      - |
        LSREGISTER="/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
        for stale_app in \
          "$HOME/.local/markd.app" \
          "$HOME/.local/Cellar/markd/0.0.0/markd.app" \
          "{{.ROOT_DIR}}/../../../lab/markd/build-publish/markd.app" \
          "{{.ROOT_DIR}}/../build/Release/Markd.app"; do
          if [[ -e "$stale_app" ]]; then
            "$LSREGISTER" -u "$stale_app" 2>/dev/null || true
          fi
        done
        rm -rf "$HOME/.local/markd.app" "$HOME/.local/Cellar/markd" "$HOME/.local/opt/markd"
        rm -rf /Applications/Markd.app
        cp -R "{{.BUILD_DIR}}/dist/Markd.app" /Applications/Markd.app
        ln -s /Applications/Markd.app "$HOME/.local/markd.app"
        "$LSREGISTER" -f /Applications/Markd.app

  install-cli:
    desc: Install hermetic Markd.app bundle into ~/.local/libexec/Markd.app and CLI launcher into ~/.local/bin/markd
    deps: [package-macos]
    cmds:
      - mkdir -p ~/.local/bin ~/.local/libexec
      - rm -rf ~/.local/libexec/Markd.app
      - cp -R "{{.BUILD_DIR}}/dist/Markd.app" ~/.local/libexec/Markd.app
      - |
        cat << 'EOF' > ~/.local/bin/markd
        #!/bin/sh
        exec "$HOME/.local/libexec/Markd.app/Contents/MacOS/markd" "$@"
        EOF
      - chmod 0755 ~/.local/bin/markd
      - ~/.local/bin/markd --version
