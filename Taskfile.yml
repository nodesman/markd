version: '3'

vars:
  QT_DIR: /Users/rajsekharan/Qt/6.5.3/macos
  BUILD_DIR: build

tasks:
  default:
    cmds:
      - task -l

  configure:
    desc: Configure CMake build for Markd with Qt 6.5.3
    cmds:
      - cmake -B {{.BUILD_DIR}} -S . -DCMAKE_PREFIX_PATH={{.QT_DIR}}/lib/cmake

  build:
    desc: Compile Markd executable and test suite
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j8

  test-cpp:
    desc: Run C++ test suite (pure C++, headless)
    deps: [build]
    cmds:
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure

  test-web:
    desc: Run JavaScript test suite with Node.js
    dir: web
    cmds:
      - npm test

  coverage-web:
    desc: Run JavaScript test suite with c8 and verify 100% branch and line coverage
    dir: web
    cmds:
      - npm run test:coverage

  coverage-cpp:
    desc: Run C++ test suite and enforce >= 95% line coverage via LLVM source instrumentation
    cmds:
      - cmake -B build_cov -S . -DCMAKE_PREFIX_PATH={{.QT_DIR}}/lib/cmake -DENABLE_COVERAGE=ON
      - cmake --build build_cov -j8
      - LLVM_PROFILE_FILE=build_cov/test_cli.profraw ./build_cov/test_cli
      - xcrun llvm-profdata merge -sparse build_cov/test_cli.profraw -o build_cov/test_cli.profdata
      - node ../../../kernel/quality-gate/check_cpp_coverage.js ./build_cov/test_cli build_cov/test_cli.profdata 95.0

  coverage:
    desc: Run both C++ and Web coverage verification suites (100% web, >=95% C++)
    cmds:
      - task: coverage-web
      - task: coverage-cpp

  calisthenics:
    desc: Run Sovereign Object Calisthenics static analysis audit
    cmds:
      - node ../../../kernel/quality-gate/calisthenics_auditor.js src
      - node ../../../kernel/quality-gate/calisthenics_auditor.js web/src

  test:
    desc: Run both decoupled test suites (C++ and Web)
    cmds:
      - task: test-cpp
      - task: test-web

  test-all:
    desc: Alias for test
    cmds:
      - task: test


  run:
    desc: Run Markd executable with optional markdown file (e.g. task run -- file.md)
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/markd {{.CLI_ARGS}}

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  install-cli:
    desc: Symlink/install markd executable wrapper to ~/.local/bin/markd
    deps: [build]
    cmds:
      - mkdir -p ~/.local/bin
      - |
        cat << 'EOF' > ~/.local/bin/markd
        #!/usr/bin/env bash
        set -euo pipefail
        export QT_PREFIX="{{.QT_DIR}}"
        export DYLD_FRAMEWORK_PATH="$QT_PREFIX/lib:${DYLD_FRAMEWORK_PATH:-}"
        export DYLD_LIBRARY_PATH="$QT_PREFIX/lib:${DYLD_LIBRARY_PATH:-}"
        export QT_PLUGIN_PATH="$QT_PREFIX/plugins"
        export QT_QPA_PLATFORM_PLUGIN_PATH="$QT_PREFIX/plugins/platforms"
        BINARY="{{.ROOT_DIR}}/build/markd"
        if [[ ! -x "$BINARY" ]]; then
          echo "Error: Markd binary not found at $BINARY. Run 'task build' first." >&2
          exit 1
        fi
        exec "$BINARY" "$@"
        EOF
      - chmod +x ~/.local/bin/markd
      - ~/.local/bin/markd --version

